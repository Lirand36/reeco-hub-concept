# One-click deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: reeco-hub
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Used in Slack messages for "Open in Reeco Hub" links, e.g. https://reeco-hub.onrender.com
      - key: PUBLIC_URL
        sync: false
      # Live systems (optional; each one goes live on its own). See Connections → "How to connect".
      - key: HUBSPOT_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_DM_USER_ID
        sync: false
      - key: SLACK_APPROVER_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_INVITE_EMAIL
        sync: false
